<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Beauty - Productos</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componente.css">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <a href="index.html" class="logo-area">
    <img src="./img/logo.png" alt="Logo Pure Beauty" width="100">
</a>

      <div class="nav-and-actions">
        <div class="top-nav-row">
          <nav>
            <ul class="nav-links">
              <li><a href="index.html" class="nav-link">Inicio</a></li>
              <li><a href="coleccion.html" class="nav-link active">Productos</a></li>
              <li><a href="coleccion.html" class="nav-link">Novedades</a></li>
            </ul>
          </nav>

          <div class="search-cart-area">
            <div class="search-box">
              <input type="text" class="search-input" placeholder="Buscar productos..." aria-label="Buscar productos">
              <button class="search-btn" type="button" aria-label="Buscar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </button>
            </div>

            <a href="#resumen-carrito" id="contador-carrito">Carrito (0)</a>

<div id="resumen-carrito">
    <h3>Mi carrito</h3>

    <div id="lista-carrito">
        <p>Tu carrito está vacío.</p>
    </div>

    <p id="total-carrito">Total: $0</p>
</div>

        <div class="nav-divider"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="catalog-title">NUEVOS PRODUCTOS</h1>

    <div class="catalog-layout">

    <aside class="sidebar-categories">
        <h3>Categorías</h3>
        <ul class="category-list">
            <li><a href="#" class="active">Labios</a></li>
            <li><a href="#">Rostro</a></li>
            <li><a href="#">Cejas</a></li>
            <li><a href="#">Pestañas</a></li>
            <li><a href="#">Ojos</a></li>
            <li><a href="#">Accesorios</a></li>
            <li><a href="#">Brochas</a></li>
        </ul>
    </aside>

    <div class="catalog-content">

        <div class="catalog-filters">
            <label for="filtro-talla">Filtrar por talla:</label>
            <select id="filtro-talla">
                <option value="">Todas las tallas</option>
                <option value="Única">Única</option>
            </select>

            <label for="filtro-color">Filtrar por color:</label>
            <select id="filtro-color">
                <option value="">Todos los colores</option>
                <option value="Rojo">Rojo</option>
                <option value="Beige">Beige</option>
                <option value="Marrón">Marrón</option>
                <option value="Negro">Negro</option>
            </select>

            <button type="button" id="limpiar-filtros">
                Limpiar filtros
            </button>
        </div>

        <section class="catalog-grid" id="contenedor-productos">
        </section>

    </div>

</div>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <span class="logo-text">PURE BEAUTY</span>
      <p class="footer-text">&copy; 2026 Pure Beauty. Todos los derechos reservados.</p>
    </div>
  </footer>
  <script src="js/producto.js"></script>
</body>
</html>
