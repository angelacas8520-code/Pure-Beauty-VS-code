<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pure Beauty - Inicio</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componente.css">
  <link rel="stylesheet" href="css/paginas.css">
</head>
<body>
  <header class="header">
    <div class="container header-container">
      <a href="index.html" class="logo-area">
        <img src="img/logo.png" alt="Logo Pure Beauty" class="logo-img">
      </a>

      <div class="nav-and-actions">
        <div class="top-nav-row">
          <nav>
            <ul class="nav-links">
              <li><a href="index.html" class="nav-link active">Inicio</a></li>
              <li><a href="coleccion.html" class="nav-link">Productos</a></li>
              <li><a href="coleccion.html" class="nav-link">Novedades</a></li>
            </ul>
          </nav>

          <div class="search-cart-area">
            <div class="search-box">
              <input type="text" class="search-input" placeholder="Buscar productos..." aria-label="Buscar productos">
              <button class="search-btn" type="button" aria-label="Buscar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </button>
            </div>

            <a href="#" class="cart-icon" aria-label="Carrito de compras" onclick="alert('Carrito vacío'); return false;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            </a>
          </div>
        </div>

        <div class="nav-divider"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero-section">
      <div class="hero-img-col">
        <img src="img/makeup.png" alt="Maquillaje Pure Beauty">
      </div>
      <div class="hero-text-col">
        <h1 class="hero-title">Realza tu belleza</h1>
        <p class="hero-subtitle">Maquillaje de calidad para brillar todos los días</p>
        <a href="coleccion.html" class="btn btn-magenta">PÁGINA DE INICIO →</a>
      </div>
    </section>

        <section class="login-section">

      <h2>Iniciar sesión</h2>

      <form id="formulario-login">

        <div class="form-group">
          <label for="correo">Correo electrónico</label>
          <input
            type="email"
            id="correo"
            placeholder="Ingresa tu correo"
            required
          >
        </div>

        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input
            type="password"
            id="contrasena"
            placeholder="Ingresa tu contraseña"
            required
          >
        </div>

        <button type="submit" class="btn btn-magenta">
          Iniciar sesión
        </button>

        <p id="mensaje-login"></p>

      </form>

    </section>

  </main>

  <footer class="footer">
    <div class="container footer-content">
      <span class="logo-text">PURE BEAUTY</span>
      <p class="footer-text">&copy; 2026 Pure Beauty. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="js/login.js"></script>
  
</body>
</html>
